name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: ori_manager
      DATABASE_USER: ori_user
      DATABASE_PASSWORD: ori_ci_password

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ori_manager
          POSTGRES_USER: ori_user
          POSTGRES_PASSWORD: ori_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ori_user -d ori_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Validate dependency lock
        run: uv lock --check

      - name: Run Ruff
        run: uv run ruff check .

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
