services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:noble

    volumes:
      - .:/workspace:cached

    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ori_manager
      DATABASE_USER: ori_user
      DATABASE_PASSWORD: ori_dev_password
      UV_LINK_MODE: copy
      DATABASE_SSLMODE: disable

  db:
    image: postgres:18

    restart: unless-stopped

    environment:
      POSTGRES_DB: ori_manager
      POSTGRES_USER: ori_user
      POSTGRES_PASSWORD: ori_dev_password

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ori_user -d ori_manager"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: