projects:
  - name: ori-manager
    environments:
      - name: Production
        services:
          # ==========================================
          # BACKEND — FastAPI
          # ==========================================
          - type: web
            name: ori-manager-backend-production
            runtime: python
            plan: free
            region: oregon
            rootDir: backend
            branch: main

            buildCommand: uv sync --frozen --no-dev
            startCommand: uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port $PORT

            healthCheckPath: /health
            autoDeployTrigger: off

            envVars:
              - key: APP_ENV
                value: production

              - key: PYTHON_VERSION
                value: 3.13.15

              - key: UV_VERSION
                value: 0.12.12

              - key: DATABASE_HOST
                sync: false

              - key: DATABASE_PORT
                value: "5432"

              - key: DATABASE_NAME
                value: postgres

              - key: DATABASE_USER
                sync: false

              - key: DATABASE_PASSWORD
                sync: false

              - key: DATABASE_SSLMODE
                value: require

          # ==========================================
          # FRONTEND — React + Vite
          # ==========================================
          - type: web
            name: ori-manager-frontend-production
            runtime: static
            rootDir: frontend
            branch: main

            buildCommand: npm ci && npm run build
            staticPublishPath: dist

            autoDeployTrigger: off

            routes:
              - type: rewrite
                source: /*
                destination: /index.html

            envVars:
              - key: NODE_VERSION
                value: 24.21.0
