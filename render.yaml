projects:
  - name: ori-manager
    environments:
      # ==========================================
      # 1. ENTORNO DE PRODUCCIÓN
      # ==========================================
      - name: Production
        services:
          # --- BACKEND ---
          - type: web
            name: ori-manager-backend-production
            runtime: docker
            rootDir: backend
            dockerfilePath: ./Dockerfile
            plan: free
            branch: main
            autoDeploy: true
            previews:
              generation: "off"
            envVars:
              - key: PY_ENV
                value: production
              - key: PORT
                value: "80"
              - key: DATABASE_URL
                sync: false

          # --- FRONTEND ---
          - type: web
            name: ori-manager-frontend-production
            runtime: static
            rootDir: frontend
            buildCommand: npm run build
            staticPublishPath: dist # Cambia a 'build' según tu framework (React/Vite/etc)
            branch: main
            autoDeploy: true
            previews:
              generation: "off"

      # ==========================================
      # 2. ENTORNO DE STAGING (PRUEBAS)
      # ==========================================
      - name: Staging
        services:
          # --- BACKEND ---
          - type: web
            name: ori-manager-backend-staging
            runtime: docker
            rootDir: backend
            dockerfilePath: ./Dockerfile
            plan: free
            branch: develop
            autoDeploy: true
            previews:
              generation: "off"
            envVars:
              - key: PY_ENV
                value: staging
              - key: PORT
                value: "80"
              - key: DATABASE_URL
                sync: false

          # --- FRONTEND ---
          - type: web
            name: ori-manager-frontend-staging
            runtime: static
            rootDir: frontend
            buildCommand: npm run build
            staticPublishPath: dist
            branch: develop
            autoDeploy: true
            previews:
              generation: "off"
